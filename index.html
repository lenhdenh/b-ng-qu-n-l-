<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiếng Việt - Đăng Nhập</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="language-selector">Tiếng Việt</div>
        
        <div class="login-box">
            <div class="facebook-logo">
                <svg viewBox="0 0 24 24" width="64" height="64" fill="#1877F2">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
            </div>

            <form id="loginForm" class="login-form">
                <input 
                    type="email" 
                    id="email" 
                    placeholder="Số di động hoặc email" 
                    required
                    class="input-field"
                >
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Mật khẩu" 
                    required
                    class="input-field"
                >
                <button type="submit" class="btn-login">Đăng nhập</button>
            </form>

            <div class="forgot-password">
                <a href="#">Quên mật khẩu?</a>
            </div>

            <div class="divider"></div>

            <button class="btn-signup" id="signupBtn">Tạo tài khoản mới</button>
        </div>

        <div class="footer-meta">
            <img src="https://www.meta.com/favicon.ico" alt="Meta" class="meta-logo">
            <span>Meta</span>
        </div>

        <div class="footer-links">
            <a href="#">Giới thiệu</a>
            <a href="#">Trợ giúp</a>
            <a href="#">Xem thêm</a>
        </div>
    </div>

    <!-- Signup Modal -->
    <div id="signupModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Tạo tài khoản mới</h2>
            <form id="signupForm" class="signup-form">
                <input 
                    type="text" 
                    id="fullname" 
                    placeholder="Họ và tên" 
                    required
                    class="input-field"
                >
                <input 
                    type="email" 
                    id="signupEmail" 
                    placeholder="Email" 
                    required
                    class="input-field"
                >
                <input 
                    type="password" 
                    id="signupPassword" 
                    placeholder="Mật khẩu" 
                    required
                    class="input-field"
                >
                <input 
                    type="password" 
                    id="confirmPassword" 
                    placeholder="Xác nhận mật khẩu" 
                    required
                    class="input-field"
                >
                <button type="submit" class="btn-login">Đăng ký</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
